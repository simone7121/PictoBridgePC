[package]
name = "pictobridge"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "pictobridge"
path = "src/main.rs"
test = false
bench = false

[dependencies]
foa_dswifi = { path = "../vendor/foa_dswifi" }
foa = { path = "../vendor/FoA/foa", features = ["esp32", "defmt"] }
esp-hal = { version = "=1.0.0-rc.0", features = ["esp32", "unstable"] }
esp-hal-embassy = { version = "=0.9.0", features = ["esp32"] }
esp-alloc = "=0.8.0"
esp-backtrace = { version = "=0.17.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "=0.15.0", default-features = false, features = ["esp32", "uart"] }
esp-bootloader-esp-idf = { version = "=0.2.0", features = ["esp32"] }
embassy-executor = { version = "=0.7.0", features = ["nightly"] }
embassy-time = "=0.4.0"
embassy-sync = "=0.7.1"
embassy-futures = "=0.1.1"
embedded-io-async = "=0.6.1"
static_cell = { version = "=2.1.1", features = ["nightly"] }
heapless = "=0.8.0"
ieee80211 = "=0.5.9"
defmt = "=1.0.1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = 2
overflow-checks = false
